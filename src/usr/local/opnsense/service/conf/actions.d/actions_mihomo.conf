[start]
command:sh /usr/local/etc/rc.d/mihomo start
parameters:
type:script
message:starting mihomo

[stop]
command:sh /usr/local/etc/rc.d/mihomo stop
parameters:
type:script
message:stopping mihomo

[restart]
command:sh /usr/local/etc/rc.d/mihomo restart
parameters:
type:script
message:restarting mihomo
description:Restart mihomo service

[status]
command:sh /usr/local/etc/rc.d/mihomo status;exit 0
parameters:
type:script_output
message:request mihomo status

[sub-update]
command:/usr/bin/mihomo_sub
parameters:
type:script_output
description:Renew mihomo Subscription

# ---------------------------------------------------------------------------
# 以下为二次开发新增的 WebUI 后端动作。
# 全部以 root 运行（php-fpm 以 www 运行，无法直接写 /usr/local/etc/mihomo 与
# /var/log/mihomo.log，必须经 configd 提权）。
# ---------------------------------------------------------------------------

[config-check]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/config_apply.php check
parameters:%s
errors:no
type:script_output
message:validate mihomo configuration

[config-install]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/config_apply.php install
parameters:%s
errors:no
type:script_output
message:install mihomo configuration

[config-current]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/config_apply.php current
errors:no
type:script_output
message:validate the active mihomo configuration

[log-tail]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/logtail.php
parameters:%s %s
errors:no
type:script_output
message:read mihomo log

[log-clear]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/logclear.php
parameters:%s
errors:no
type:script_output
message:clear mihomo log

[set-enabled]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/service_enable.php
parameters:%s
errors:no
type:script_output
message:set mihomo boot-time autostart

[sub-run]
command:/usr/local/opnsense/scripts/mihomo/subscription_run.sh
parameters:%s
errors:no
type:script_output
message:run mihomo subscription update

[env-get]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/env.php get
errors:no
type:script_output
message:read mihomo subscription settings

[env-set]
command:/usr/local/bin/php /usr/local/opnsense/scripts/mihomo/env.php set
parameters:%s %s
errors:no
type:script_output
message:write mihomo subscription settings
